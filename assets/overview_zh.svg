    <text x="72" y="192" fill="#0F172A" font-size="13.5" font-weight="700">人类活动与技能</text>
    <text x="72" y="210" fill="#64748B" font-size="11.5">日常生活、职业技能、运动与新兴岗位</text>

    <rect x="36" y="230" width="268" height="48" rx="10" fill="#FFFFFF" stroke="#FBBF24" stroke-width="1.5"/>
    <circle cx="56" cy="254" r="6" fill="#D97706"/>
    <text x="72" y="250" fill="#0F172A" font-size="13.5" font-weight="700">方法与技术流程</text>
    <text x="72" y="268" fill="#64748B" font-size="11.5">计算机体系、前沿 AI 方法与工程实践</text>

    <rect x="36" y="288" width="268" height="48" rx="10" fill="#FFFFFF" stroke="#F472B6" stroke-width="1.5"/>
    <circle cx="56" cy="312" r="6" fill="#DB2777"/>
    <text x="72" y="308" fill="#0F172A" font-size="13.5" font-weight="700">器物、风格与历史时期</text>
    <text x="72" y="326" fill="#64748B" font-size="11.5">艺术建筑、材料器物与全球历史断代</text>

    <rect x="36" y="346" width="268" height="48" rx="10" fill="#FFFFFF" stroke="#A78BFA" stroke-width="1.5"/>
    <circle cx="56" cy="370" r="6" fill="#7C3AED"/>
    <text x="72" y="366" fill="#0F172A" font-size="13.5" font-weight="700">人机协作姿态</text>
    <text x="72" y="384" fill="#64748B" font-size="11.5">学习探索、协同创作、校验与委派模式</text>
