<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" width="1040" height="420" role="img" aria-label="Human KOS 运作全景图">
  <defs>
    <linearGradient id="cardBgZh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <marker id="arrowZh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1040" height="420" rx="18" fill="url(#cardBgZh)" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="36" y="42" fill="#0F172A" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="20" font-weight="700">Human KOS 如何组织人类知识版图</text>
  <text x="36" y="64" fill="#475569" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="13">一个随身核心文件覆盖日常跨领域检索 + 十个可选扩展包按需挂载，开箱即用、完全离线</text>

  <!-- Column 1: 5 Dimensions -->
  <text x="36" y="102" fill="#334155" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="13" font-weight="700">1. 五大清晰维度</text>
  <g font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
    <rect x="36" y="114" width="268" height="48" rx="10" fill="#FFFFFF" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="56" cy="138" r="6" fill="#0284C7"/>
    <text x="72" y="134" fill="#0F172A" font-size="13.5" font-weight="700">学科与知识领域</text>
