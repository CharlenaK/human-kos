<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220" role="img" aria-label="Human KOS — An Offline Atlas of Human Knowledge">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#132242"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
  </defs>

  <rect width="960" height="220" rx="20" fill="url(#heroBg)"/>
  <rect x="1" y="1" width="958" height="218" rx="19" fill="none" stroke="#334155" stroke-opacity="0.55" stroke-width="1.2"/>

  <!-- Subtle constellation emblem on the left -->
  <g transform="translate(128, 110)">
    <circle r="68" fill="none" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="4 5"/>
    <circle r="44" fill="none" stroke="#34D399" stroke-opacity="0.28" stroke-width="1.2"/>
    <circle r="20" fill="#1E293B" stroke="#60A5FA" stroke-width="1.6"/>
    <!-- Connection lines -->
    <line x1="0" y1="0" x2="0" y2="-56" stroke="#38BDF8" stroke-opacity="0.65" stroke-width="1.4"/>
    <line x1="0" y1="0" x2="53" y2="-17" stroke="#34D399" stroke-opacity="0.65" stroke-width="1.4"/>
    <line x1="0" y1="0" x2="33" y2="45" stroke="#FBBF24" stroke-opacity="0.65" stroke-width="1.4"/>
    <line x1="0" y1="0" x2="-33" y2="45" stroke="#F472B6" stroke-opacity="0.65" stroke-width="1.4"/>
    <line x1="0" y1="0" x2="-53" y2="-17" stroke="#A78BFA" stroke-opacity="0.65" stroke-width="1.4"/>
    <!-- Cross-field ring -->
    <polygon points="0,-56 53,-17 33,45 -33,45 -53,-17" fill="none" stroke="#94A3B8" stroke-opacity="0.32" stroke-width="1"/>
    <!-- 5 facet stars -->
    <circle cx="0" cy="-56" r="8" fill="#38BDF8"/>
    <circle cx="53" cy="-17" r="8" fill="#34D399"/>
    <circle cx="33" cy="45" r="8" fill="#FBBF24"/>
    <circle cx="-33" cy="45" r="8" fill="#F472B6"/>
    <circle cx="-53" cy="-17" r="8" fill="#A78BFA"/>
    <circle cx="0" cy="0" r="6" fill="#F8FAFC"/>
  </g>

  <!-- Title & tagline -->
  <text x="235" y="92" fill="#F8FAFC" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="46" font-weight="800" letter-spacing="0.5">Human KOS</text>
  <rect x="235" y="106" width="210" height="4" rx="2" fill="url(#accent)"/>
  <text x="235" y="138" fill="#E2E8F0" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="19" font-weight="500">An Offline, Bilingual Atlas of Human Knowledge</text>
  <text x="235" y="166" fill="#94A3B8" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="14">84,552 Core Concepts · 10 Plug-in Packs · 5 Human Dimensions · Zero Cloud Lock-In</text>

  <!-- Subtle right-side decorative pills -->
  <g font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="11.5" font-weight="600">
    <rect x="752" y="42" width="166" height="28" rx="14" fill="#0EA5E9" fill-opacity="0.16" stroke="#38BDF8" stroke-opacity="0.5"/>
    <text x="835" y="60" text-anchor="middle" fill="#BAE6FD">Fields &amp; Disciplines</text>

    <rect x="752" y="80" width="166" height="28" rx="14" fill="#10B981" fill-opacity="0.16" stroke="#34D399" stroke-opacity="0.5"/>
    <text x="835" y="98" text-anchor="middle" fill="#A7F3D0">Activities &amp; Skills</text>

    <rect x="752" y="118" width="166" height="28" rx="14" fill="#F59E0B" fill-opacity="0.16" stroke="#FBBF24" stroke-opacity="0.5"/>
    <text x="835" y="136" text-anchor="middle" fill="#FDE68A">Methods &amp; Processes</text>

    <rect x="752" y="156" width="166" height="28" rx="14" fill="#EC4899" fill-opacity="0.16" stroke="#F472B6" stroke-opacity="0.5"/>
    <text x="835" y="174" text-anchor="middle" fill="#FBCFE8">Objects, Eras &amp; Stances</text>
  </g>
</svg>
